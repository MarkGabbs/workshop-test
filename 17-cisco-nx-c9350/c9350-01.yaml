---
# Ansible playbook for Cisco Catalyst C9350-24 (IOS-XE)
# Hostname: c9350-01
# Domain: vmware.wei
# Management / VLAN 1: 10.10.1.1/24
# VLANs 10-19: gateways 10.10.10.1 through 10.10.19.1 /24
# Upstream gateway: 10.200.200.1
# NTP: ntp01.vmware.wei
# DNS: 10.11.242.11, 10.11.242.12
# Syslog: syslog.vmware.wei
#
# Ports:
#   Gi1/0/1   - Crashcart laptop (access VLAN 10)
#   Gi1/0/11-12 - Trunks to hypervisors (native VLAN 10, allow 1+10-19, portfast trunk)
#   Gi1/0/13-14 - IPMI (access VLAN 10)
#   All other ports shutdown
#
# Usage:
#   ansible-playbook -i inventory c9350-config.yml --limit c9350-01
#   (or run with --check first)
# If you need to be prompted for the enable password
# ansible-playbook -i inventory c9350-config.yml --limit c9350-01 -K

- name: Configure Cisco Catalyst C9350-01
  hosts: c9350-01
  gather_facts: false
  collections:
    - cisco.ios

  vars:
    ansible_connection: ansible.netcommon.network_cli
    ansible_network_os: cisco.ios.ios
    ansible_become: true
    ansible_become_method: enable

  tasks:
    - name: Set hostname, domain, DNS, NTP, timestamps, password encryption
      cisco.ios.ios_config:
        lines:
          - hostname c9350-01
          - ip domain name vmware.wei
          - ip name-server 10.11.242.11 10.11.242.12
          - ntp server ntp01.vmware.wei
          - service timestamps debug datetime msec localtime show-timezone
          - service timestamps log datetime msec localtime show-timezone
          - service password-encryption
          - ip routing
          - spanning-tree mode rapid-pvst
          - spanning-tree extend system-id
          - spanning-tree portfast bpduguard default
          - no ip http server
          - no ip http secure-server
          - banner motd ^Authorized access only. Activity is logged.^
        save_when: modified

    - name: Configure logging to syslog.vmware.wei
      cisco.ios.ios_config:
        lines:
          - logging host syslog.vmware.wei
          - logging trap informational
        save_when: modified

    - name: Configure static default route via upstream gateway
      cisco.ios.ios_static_routes:
        config:
          - address_families:
              - afi: ipv4
                routes:
                  - dest: 0.0.0.0/0
                    next_hops:
                      - forward_router_address: 10.200.200.1
        state: merged

    - name: Create VLANs 1 and 10-19
      cisco.ios.ios_vlans:
        config:
          - vlan_id: 1
            name: MANAGEMENT
            state: active
          - vlan_id: 10
            name: VLAN10
            state: active
          - vlan_id: 11
            name: VLAN11
            state: active
          - vlan_id: 12
            name: VLAN12
            state: active
          - vlan_id: 13
            name: VLAN13
            state: active
          - vlan_id: 14
            name: VLAN14
            state: active
          - vlan_id: 15
            name: VLAN15
            state: active
          - vlan_id: 16
            name: VLAN16
            state: active
          - vlan_id: 17
            name: VLAN17
            state: active
          - vlan_id: 18
            name: VLAN18
            state: active
          - vlan_id: 19
            name: VLAN19
            state: active
        state: merged

    - name: Configure SVIs (Layer 3 gateways)
      cisco.ios.ios_l3_interfaces:
        config:
          - name: Vlan1
            ipv4:
              - address: 10.10.1.1/24
          - name: Vlan10
            ipv4:
              - address: 10.10.10.1/24
          - name: Vlan11
            ipv4:
              - address: 10.10.11.1/24
          - name: Vlan12
            ipv4:
              - address: 10.10.12.1/24
          - name: Vlan13
            ipv4:
              - address: 10.10.13.1/24
          - name: Vlan14
            ipv4:
              - address: 10.10.14.1/24
          - name: Vlan15
            ipv4:
              - address: 10.10.15.1/24
          - name: Vlan16
            ipv4:
              - address: 10.10.16.1/24
          - name: Vlan17
            ipv4:
              - address: 10.10.17.1/24
          - name: Vlan18
            ipv4:
              - address: 10.10.18.1/24
          - name: Vlan19
            ipv4:
              - address: 10.10.19.1/24
        state: merged

    - name: Ensure SVIs are not shutdown and have descriptions
      cisco.ios.ios_interfaces:
        config:
          - name: Vlan1
            description: Management VLAN SVI
            enabled: true
          - name: Vlan10
            description: Gateway for VLAN 10
            enabled: true
          - name: Vlan11
            description: Gateway for VLAN 11
            enabled: true
          - name: Vlan12
            description: Gateway for VLAN 12
            enabled: true
          - name: Vlan13
            description: Gateway for VLAN 13
            enabled: true
          - name: Vlan14
            description: Gateway for VLAN 14
            enabled: true
          - name: Vlan15
            description: Gateway for VLAN 15
            enabled: true
          - name: Vlan16
            description: Gateway for VLAN 16
            enabled: true
          - name: Vlan17
            description: Gateway for VLAN 17
            enabled: true
          - name: Vlan18
            description: Gateway for VLAN 18
            enabled: true
          - name: Vlan19
            description: Gateway for VLAN 19
            enabled: true
        state: merged

    - name: Configure Layer 2 interfaces (access and trunks)
      cisco.ios.ios_l2_interfaces:
        config:
          # Crashcart laptop - access VLAN 10
          - name: GigabitEthernet1/0/1
            mode: access
            access:
              vlan: 10
          # Trunks to hypervisors - native VLAN 10, allow 1+10-19, portfast trunk
          - name: GigabitEthernet1/0/11
            mode: trunk
            trunk:
              native_vlan: 10
              allowed_vlans: "1,10-19"
            portfast:
              trunk: true
          - name: GigabitEthernet1/0/12
            mode: trunk
            trunk:
              native_vlan: 10
              allowed_vlans: "1,10-19"
            portfast:
              trunk: true
          # IPMI ports - access VLAN 10
          - name: GigabitEthernet1/0/13
            mode: access
            access:
              vlan: 10
          - name: GigabitEthernet1/0/14
            mode: access
            access:
              vlan: 10
        state: merged

    - name: Apply descriptions, enable active ports, and portfast/bpduguard on access ports
      cisco.ios.ios_config:
        parents: "{{ item.parent }}"
        lines: "{{ item.lines }}"
      loop:
        - parent: interface GigabitEthernet1/0/1
          lines:
            - description sampleDesc - Crashcart laptop
            - spanning-tree portfast
            - spanning-tree bpduguard enable
            - no shutdown
        - parent: interface GigabitEthernet1/0/11
          lines:
            - description sampleDesc - Hypervisor trunk
            - switchport nonegotiate
            - no shutdown
        - parent: interface GigabitEthernet1/0/12
          lines:
            - description sampleDesc - Hypervisor trunk
            - switchport nonegotiate
            - no shutdown
        - parent: interface GigabitEthernet1/0/13
          lines:
            - description sampleDesc - esx01-ipmi
            - spanning-tree portfast
            - spanning-tree bpduguard enable
            - no shutdown
        - parent: interface GigabitEthernet1/0/14
          lines:
            - description sampleDesc - esx02-ipmi
            - spanning-tree portfast
            - spanning-tree bpduguard enable
            - no shutdown
      register: interface_extras

    - name: Shutdown all unused ports (2-10 and 15-24)
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item }}"
            enabled: false
            description: Unused - shutdown
        loop:
          - GigabitEthernet1/0/2
          - GigabitEthernet1/0/3
          - GigabitEthernet1/0/4
          - GigabitEthernet1/0/5
          - GigabitEthernet1/0/6
          - GigabitEthernet1/0/7
          - GigabitEthernet1/0/8
          - GigabitEthernet1/0/9
          - GigabitEthernet1/0/10
          - GigabitEthernet1/0/15
          - GigabitEthernet1/0/16
          - GigabitEthernet1/0/17
          - GigabitEthernet1/0/18
          - GigabitEthernet1/0/19
          - GigabitEthernet1/0/20
          - GigabitEthernet1/0/21
          - GigabitEthernet1/0/22
          - GigabitEthernet1/0/23
          - GigabitEthernet1/0/24
        state: merged

    - name: Basic SSH and local user (replace secrets in production)
      cisco.ios.ios_config:
        lines:
          - ip ssh version 2
          - ip ssh time-out 60
          - ip ssh authentication-retries 3
          - username admin privilege 15 secret 0 ChangeMe123!
          - line vty 0 15
          - transport input ssh
          - exec-timeout 10 0
          - login local
          - line console 0
          - exec-timeout 15 0
          - logging synchronous
        save_when: modified
      # Note: crypto key generate rsa must be done separately or via a prior task
      # if not already present (it is interactive or requires modulus).

    - name: Save configuration
      cisco.ios.ios_config:
        save_when: modified
