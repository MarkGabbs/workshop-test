
# Linux hosts
[linux]
web01 ansible_host=10.11.242.198
web02 ansible_host=10.11.242.198
web03  ansible_host=10.11.242.197

[linux:vars]
ansible_user=ansible
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_become=true
ansible_become_method=sudo






# Windows hosts
[windows]
myhost ansible_host=10.11.242.199

# Alias + IP
win01 ansible_host=10.0.0.40

# Real hostname (no ansible_host needed if DNS resolves it)
server01.vmware.wei

# Alias + FQDN
win01 ansible_host=server01.vmware.wei

[windows:vars]
ansible_user=Administrator
ansible_password={{ vault_windows_password }}   # or ansible_winrm_pass
ansible_connection=psrp                         # preferred modern plugin
ansible_port=5986                               # HTTPS (or 5985 for HTTP)
ansible_psrp_protocol=https
ansible_psrp_auth=kerberos                      # or ntlm / negotiate / credssp
ansible_winrm_server_cert_validation=ignore   # only if using self-signed certs

# Optional combined group
[all:vars]
# anything common to both (rarely needed)




# macOS already includes OpenSSH. 
# You just need Remote Login enabled
# System Settings → General → Sharing → Remote Login.

[macs]
macbook01 ansible_host=10.0.0.50
macbook02 ansible_host=10.0.0.51
imac01    ansible_host=10.0.0.52

[macs:vars]
ansible_user=admin
ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_become=true
ansible_become_method=sudo
ansible_become_password={{ vault_mac_sudo_password }}   # if needed
























