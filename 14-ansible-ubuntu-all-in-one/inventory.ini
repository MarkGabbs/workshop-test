# Ansible Inventory — Mixed OS Environment
# Domain / AD / Internal DNS: vmware.wei
#
# Best Practices Applied:
# - Group-level vars for connection settings (prefer group_vars/ directory in real projects)
# - Secrets referenced via vault variables (never hard-code passwords)
# - HTTPS + Kerberos preferred for domain-joined Windows
# - Meaningful hostnames + explicit ansible_host where needed
# - Comments for required vs. recommended settings
#
# Recommended next steps:
#   1. ansible-vault encrypt_string 'YourPassword' --name 'vault_windows_password'
#   2. Move [*:vars] sections into inventory/group_vars/{windows,linux,macos}.yml
#   3. For Kerberos: install pywinrm[kerberos] + configure /etc/krb5.conf on the controller

# =============================================================================
# Windows Hosts (WinRM)
# =============================================================================
[windows]
# --- Referenced by FQDN ---
dc11.vmware.wei
dc12.vmware.wei
ca11.vmware.wei

# --- Referenced by IP ---
10.10.10.11
10.10.10.12

[windows:vars]
# ---- Required ----
ansible_connection=winrm
ansible_user=ansible@vmware.wei
ansible_password="{{ vault_windows_password }}"

# ---- Best Practice (AD Domain) ----
ansible_winrm_transport=kerberos
ansible_port=5986
ansible_winrm_scheme=https
ansible_winrm_server_cert_validation=ignore     # Change to 'validate' once you have proper CA-signed certs

# Optional but frequently needed in domain environments
# ansible_winrm_kerberos_delegation=true        # Uncomment only if double-hop is required
# ansible_winrm_realm=VMWARE.WEI                # Usually auto-detected from UPN

# ---- Alternative transports (uncomment as needed) ----
# ansible_winrm_transport=ntlm                  # Works with local or domain accounts, no Kerberos setup required
# ansible_winrm_transport=credssp               # Use only when credential delegation is mandatory

# =============================================================================
# Linux Hosts (SSH)
# =============================================================================
[linux]
# --- Referenced by FQDN ---
web01.vmware.wei
web02.vmware.wei
web03.vmware.wei

# --- Referenced by IP ---
10.10.10.21
10.10.10.22

[linux:vars]
ansible_connection=ssh
ansible_user=ansible
ansible_become=true
ansible_become_method=sudo
ansible_python_interpreter=/usr/bin/python3

# Prefer SSH keys over passwords
# ansible_ssh_private_key_file=~/.ssh/ansible_ed25519

