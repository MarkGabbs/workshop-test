---
- name: Windows baseline configuration (RDP + Ping + Local Admins)
  hosts: windows
  gather_facts: true
  become: false          # WinRM already runs as an elevated account

  vars:
    # Domain NetBIOS name
    domain_name: "VMWARE"

    # Existing AD user to add to local Administrators
    ad_user: "VMWARE\\svc_ansible"

    # Existing AD group to add to local Administrators
    ad_group: "VMWARE\\Domain Admins"

    # Require Network Level Authentication for RDP (recommended)
    rdp_require_nla: true

  tasks:
    # =========================================================================
    # Enable Remote Desktop (RDP)
    # =========================================================================
    - name: Enable RDP (set fDenyTSConnections = 0)
      ansible.windows.win_regedit:
        path: HKLM:\System\CurrentControlSet\Control\Terminal Server
        name: fDenyTSConnections
        data: 0
        type: dword

    - name: Ensure Terminal Services (TermService) is running and set to Automatic
      ansible.windows.win_service:
        name: TermService
        start_mode: auto
        state: started

    - name: Enable Remote Desktop firewall rules (TCP + UDP)
      ansible.windows.win_powershell:
        script: |
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          # Fallback: explicitly enable the common User Mode rules if the group name differs
          Enable-NetFirewallRule -Name "RemoteDesktop-UserMode-In-TCP" -ErrorAction SilentlyContinue
          Enable-NetFirewallRule -Name "RemoteDesktop-UserMode-In-UDP" -ErrorAction SilentlyContinue
      changed_when: false

    - name: Require Network Level Authentication (NLA) for RDP
      ansible.windows.win_regedit:
        path: HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp
        name: UserAuthentication
        data: 1
        type: dword
      when: rdp_require_nla | bool

    # =========================================================================
    # Allow responses to ping (ICMP Echo Request)
    # =========================================================================
    - name: Enable File and Printer Sharing ICMP Echo Request rules (IPv4 + IPv6)
      ansible.windows.win_powershell:
        script: |
          $rules = @(
            "File and Printer Sharing (Echo Request - ICMPv4-In)",
            "File and Printer Sharing (Echo Request - ICMPv6-In)"
          )
          foreach ($rule in $rules) {
            Enable-NetFirewallRule -DisplayName $rule -ErrorAction SilentlyContinue
          }
      changed_when: false

    - name: Enable Core Networking Diagnostics ICMP Echo Request rules (IPv4 + IPv6)
      ansible.windows.win_powershell:
        script: |
          $rules = @(
            "Core Networking Diagnostics - ICMP Echo Request (ICMPv4-In)",
            "Core Networking Diagnostics - ICMP Echo Request (ICMPv6-In)"
          )
          foreach ($rule in $rules) {
            Enable-NetFirewallRule -DisplayName $rule -ErrorAction SilentlyContinue
          }
      changed_when: false

    # =========================================================================
    # Add AD user and AD group to local Administrators
    # =========================================================================
    - name: Add AD user to local Administrators group
      ansible.windows.win_group_membership:
        name: Administrators
        members:
          - "{{ ad_user }}"
        state: present

    - name: Add AD group to local Administrators group
      ansible.windows.win_group_membership:
        name: Administrators
        members:
          - "{{ ad_group }}"
        state: present

    - name: Show current local Administrators members
      ansible.windows.win_group_membership:
        name: Administrators
        state: present
        members: []
      register: admin_members
      check_mode: false

    - name: Display local Administrators members
      ansible.builtin.debug:
        msg: "{{ admin_members.members }}"
