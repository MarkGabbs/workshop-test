---
- name: Configure unattended upgrades (weekly Sunday 05:00)
  hosts: linux
  become: true
  gather_facts: true

  tasks:
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present
        update_cache: true

    - name: Enable unattended-upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Download-Upgradeable-Packages "1";
          APT::Periodic::AutocleanInterval "7";
          APT::Periodic::Unattended-Upgrade "1";
        mode: '0644'
        owner: root
        group: root

    - name: Configure apt-daily-upgrade timer for Sunday 05:00
      ansible.builtin.copy:
        dest: /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
        content: |
          [Timer]
          OnCalendar=
          OnCalendar=Sun *-*-* 05:00:00
          RandomizedDelaySec=0
          Persistent=true
        mode: '0644'
      notify: Reload systemd and restart apt-daily-upgrade timer

  handlers:
    - name: Reload systemd and restart apt-daily-upgrade timer
      ansible.builtin.systemd:
        name: apt-daily-upgrade.timer
        daemon_reload: true
        state: restarted
        enabled: true
